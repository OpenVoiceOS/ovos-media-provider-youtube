[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-media-provider-youtube"
dynamic = ["version"]
description = "OVOS MediaProvider plugin for YouTube (replaces ovos-skill-youtube)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "JarbasAI", email = "jarbasai@mailfence.com" }]
requires-python = ">=3.10"
keywords = ["ovos", "OpenVoiceOS", "OCP", "media", "youtube", "MediaProvider"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mediavocab>=1.0.0",
    "ovos-plugin-manager>=2.1",
    "tutubo>=4.3.0a1",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-media-provider-youtube"
Source = "https://github.com/OpenVoiceOS/ovos-media-provider-youtube"

[project.entry-points."opm.media.provider"]
youtube = "ovos_media_provider_youtube:YouTubeMediaProvider"

[tool.setuptools]
packages = ["ovos_media_provider_youtube"]

[tool.setuptools.dynamic]
version = { attr = "ovos_media_provider_youtube.version.__version__" }
